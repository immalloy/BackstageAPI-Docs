components:
  responses:
    SessionRequired:
      description: The request has no valid signed-in session (observed as HTTP 401).
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fb_session
  parameters:
    ModId:
      name: modId
      in: path
      required: true
      description: Mod identifier shown in the site's mod URLs.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    LoginUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
        avatar: { type: integer }
        theme: { type: string }
        background: { type: integer }
        discord: { type: boolean }
        blocked: { type: array, items: { type: integer } }
    Settings:
      type: object
      properties:
        username: { type: string }
        email: { type: string, format: email }
        hasPassword: { type: boolean }
        friendRequests: { type: string }
        theme: { type: string }
        background: { type: integer }
        discord: { type: object, additionalProperties: true }
    StaffOverview:
      type: object
      properties:
        openReports: { type: integer }
        penalized: { type: integer }
        staff:
          type: array
          items: { $ref: '#/components/schemas/UserCard' }
        users: { type: integer }
        reasons: { type: array, items: {} }
    StaffReport:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        kind: { type: string }
        target: { type: integer }
        label: { type: string }
        owner: { type: [object, 'null'], additionalProperties: true }
        snapshot: { type: string }
        reason: { type: string }
        details: { type: string }
        by: { type: [object, 'null'], additionalProperties: true }
        trusted: { type: boolean }
        at: { type: string, format: date-time }
        status: { type: string }
        handledBy: { type: [object, 'null'], additionalProperties: true }
        handledAt: { type: [string, 'null'] }
        note: { type: string }
    PenalizedUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        avatar: { type: integer }
        role: { type: string }
        ban: { type: [object, 'null'], additionalProperties: true }
        mute: { type: [object, 'null'], additionalProperties: true }
    StaffMod:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        owner: { type: [object, 'null'], additionalProperties: true }
        withheld: { type: [object, 'null'], additionalProperties: true }
    StaffSiteSettings:
      allOf:
        - $ref: '#/components/schemas/SiteInfo'
        - type: object
          properties:
            blockedWords: { type: string }
    StaffAction:
      type: object
      properties:
        id: { type: integer }
        by: { type: [object, 'null'], additionalProperties: true }
        action: { type: string }
        target: { type: [object, 'null'], additionalProperties: true }
        reason: { type: string }
        at: { type: string, format: date-time }
    SiteInfo:
      type: object
      properties:
        announcement: { type: string }
        uploadsOpen: { type: boolean }
        signupsOpen: { type: boolean }
        chatOpen: { type: boolean }
        slowMode: { type: integer }
        todaysPick: { type: [string, 'null'] }
        chatRules: { type: array, items: { type: string } }
        modRules: { type: array, items: { type: string } }
        about: { type: object, additionalProperties: true }
        supporters: { type: array, items: { type: string } }
        inviteOnly: { type: boolean }
        categories:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              name: { type: string }
        stickers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              group: { type: string }
              url: { type: string }
              w: { type: integer }
              h: { type: integer }
        renders:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              url: { type: string }
    SessionUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
        ban: { type: [object, 'null'], additionalProperties: true }
        mute: { type: [object, 'null'], additionalProperties: true }
        restricted: { type: [object, 'null'], additionalProperties: true }
        avatar: { type: integer }
        theme: { type: string }
        background: { type: integer }
        discord: { type: boolean }
        blocked: { type: array, items: { type: integer } }
    ModSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        tagline: { type: string }
        engine: { type: string }
        category: { type: string }
        thumbnail: { type: string }
        card: { type: string }
        team: { oneOf: [{ $ref: '#/components/schemas/TeamSummary' }, { type: 'null' }] }
        submitter: { $ref: '#/components/schemas/UserSummary' }
        featured: { type: boolean }
        withheld: { type: [string, 'null'] }
        downloads: { type: integer }
        views: { type: integer }
        likes: { type: integer }
        stars: { type: number }
        ratings: { type: integer }
        uploaded: { type: string, format: date-time }
        updated: { type: string }
        credits: { type: array, items: { type: object, additionalProperties: true } }
        wip: { oneOf: [{ $ref: '#/components/schemas/Wip' }, { type: 'null' }] }
    ModListResponse:
      type: object
      required: [mods, total, page, pages]
      properties:
        mods:
          type: array
          items: { $ref: '#/components/schemas/ModSummary' }
        total: { type: integer }
        page: { type: integer }
        pages: { type: integer }
    ModInput:
      type: object
      properties:
        title: { type: string }
        tagline: { type: string }
        description: { type: string }
        engine: { type: string }
        category: { type: string }
        links: { type: array, items: {} }
        fileDescription: { type: string }
        file2Description: { type: string }
        file3Description: { type: string }
        file4Description: { type: string }
        file5Description: { type: string }
        version: { type: string }
        videos: { type: array, items: {} }
        createdByMe: { type: boolean }
        creator: { type: string }
        isPort: { type: boolean }
        originalMod: { type: string }
        contributors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              roles: { type: array, items: { type: string } }
        team: { type: integer }
        miscFiles: { type: array, items: {} }
        socials: { type: array, items: {} }
        wip: { type: boolean }
        stage: { type: string }
        progress: { type: integer }
        todos: { type: array, items: {} }
    ModUpdate:
      allOf:
        - $ref: '#/components/schemas/ModInput'
        - type: object
          properties:
            keep: { type: object, additionalProperties: true }
            adding: { type: object, additionalProperties: true }
    ModEdit:
      type: object
      properties:
        fields: { $ref: '#/components/schemas/ModInput' }
        thumbnail: { type: string }
        icon: { type: string }
        screenshots: { type: array, items: { type: string } }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size: { type: integer }
        published: { type: boolean }
    ModFileUpload:
      type: object
      properties:
        url: { type: [string, 'null'] }
        partSize: { type: integer }
        urls: { type: array, items: { type: string } }
    UploadedFilePart:
      type: object
      properties:
        partNumber: { type: integer }
        etag: { type: string }
    UploadResult:
      type: object
      properties:
        ok: { type: boolean }
    Mod:
      allOf:
        - $ref: '#/components/schemas/ModSummary'
        - type: object
          properties:
            description: { type: string }
