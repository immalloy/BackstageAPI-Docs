openapi: 3.1.0
info:
  title: Funkin' Backstage API
  version: '2026-11-04'
  description: >-
    Unofficial reference based on a browser capture from 2026-11-04. Routes and
    response shapes may change.
servers:
  - url: https://api.funkinbackstage.net
    description: Funkin' Backstage API
tags:
  - name: Site
  - name: Mods
  - name: Users
  - name: Teams
  - name: Session
  - name: Chat
  - name: Staff
    description: Staff routes were captured in a signed-in session. Role requirements were not verified.
paths:
  /site:
    get:
      tags: [Site]
      summary: Get site configuration and public information
      operationId: getSite
      responses:
        default:
          description: Site configuration. The HAR did not record an HTTP status for this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInfo'
  /auth/me:
    get:
      tags: [Session]
      summary: Get the current session user
      description: The capture included this request in a signed-in session. Anonymous behavior was not captured.
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/SessionUser'
                      - type: 'null'
  /auth/login:
    post:
      tags: [Session]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Signed-in user. The response sets the `fb_session` cookie.
          headers:
            Set-Cookie:
              description: Session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/LoginUser'
  /notifications:
    get:
      tags: [Session]
      summary: Get notifications for the current session
      description: Only a signed-in request was captured.
      operationId: getNotifications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notification items and unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  unread:
                    type: integer
  /notifications/read:
    post:
      tags: [Session]
      summary: Mark notifications as read
      operationId: markNotificationsRead
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Updated notification list and unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  unread:
                    type: integer
  /chat/read:
    get:
      tags: [Chat]
      summary: Get recent chat messages
      description: The capture included this request in a signed-in session.
      operationId: getChatMessages
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Chat messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
  /settings:
    get:
      tags: [Session]
      summary: Get account settings
      operationId: getSettings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Account settings. No captured values are included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    patch:
      tags: [Session]
      summary: Update account settings
      description: The capture shows a theme update; other writable fields are unknown.
      operationId: updateSettings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme: { type: string }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
  /mods:
    get:
      tags: [Mods]
      summary: List mods
      operationId: listMods
      responses:
        '200':
          description: List of mods.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModSummary'
  /mods/{modId}:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod
      operationId: getMod
      responses:
        '200':
          description: Mod details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
  /mods/{modId}/card:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod card image
      operationId: getModCard
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /mods/{modId}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod thumbnail
      operationId: getModThumbnail
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /mods/{modId}/icon:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod icon
      operationId: getModIcon
      responses:
        '200':
          content:
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /mods/{modId}/screenshots/{index}:
    parameters:
      - $ref: '#/components/parameters/ModId'
      - name: index
        in: path
        required: true
        description: Zero-based screenshot index.
        schema: { type: integer, minimum: 0 }
    get:
      tags: [Mods]
      summary: Get a mod screenshot
      operationId: getModScreenshot
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /mods/{modId}/comments:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: List comments on a mod
      operationId: listModComments
      responses:
        '200':
          description: Comments returned for the mod.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
  /mods/{modId}/votes:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get mod vote totals and current-user vote state
      operationId: getModVotes
      responses:
        '200':
          description: Vote totals and session-specific vote state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
  /mods/{modId}/like:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Mods]
      summary: Set whether the current user likes a mod
      operationId: setModLike
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        '200':
          description: Updated vote totals and current-user state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
  /mods/{modId}/rating:
    parameters:
      - $ref: '#/components/parameters/ModId'
    put:
      tags: [Mods]
      summary: Set the current user's star rating for a mod
      operationId: setModRating
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer }
      responses:
        '200':
          description: Updated vote totals and current-user state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user profile
      operationId: getUser
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user's avatar
      operationId: getUserAvatar
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /users/{userId}/banner:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user's profile banner
      operationId: getUserBanner
      responses:
        '200':
          content:
            image/webp:
              schema: { type: string, format: binary }
  /users/{userId}/posts:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's posts
      operationId: listUserPosts
      responses:
        '200':
          description: Posts authored by the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
  /users/{userId}/card:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user's profile card
      operationId: getUserCard
      responses:
        '200':
          description: Compact user profile and counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCardDetail'
  /users/{userId}/followers:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's followers
      operationId: listUserFollowers
      responses:
        '200':
          description: User cards for followers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/{userId}/following:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List users followed by a user
      operationId: listUserFollowing
      responses:
        '200':
          description: User cards for followed accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/{userId}/friends:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's friends
      operationId: listUserFriends
      responses:
        '200':
          description: User cards for friends.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/cards:
    get:
      tags: [Users]
      summary: Get profile cards for multiple users
      operationId: getUserCards
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated user IDs.
          style: form
          explode: false
          schema:
            type: array
            items: { type: integer }
      responses:
        '200':
          description: User cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/me/requests:
    get:
      tags: [Session]
      summary: Get sent and received friend requests
      description: Session-specific endpoint observed in a signed-in request.
      operationId: getFriendRequests
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Incoming and sent requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incoming:
                    type: array
                    items: { type: object, additionalProperties: true }
                  sent:
                    type: array
                    items: { type: object, additionalProperties: true }
  /users/me/blocks:
    get:
      tags: [Session]
      summary: List blocked users
      description: The captured response was empty, so blocked-user item fields are unknown.
      operationId: listBlockedUsers
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Blocked users.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
  /staff/overview:
    get:
      tags: [Staff]
      summary: Get staff dashboard counts
      operationId: getStaffOverview
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Dashboard counts, staff list, and report reasons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOverview'
  /staff/reports:
    get:
      tags: [Staff]
      summary: List staff reports
      operationId: listStaffReports
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Reports and review status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffReport'
  /staff/users:
    get:
      tags: [Staff]
      summary: Search staff user records
      description: The captured response was empty.
      operationId: searchStaffUsers
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Matching user records. Item fields were not captured.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
  /staff/penalized:
    get:
      tags: [Staff]
      summary: List penalized users
      operationId: listPenalizedUsers
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User records with ban and mute fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PenalizedUser'
  /staff/mods:
    get:
      tags: [Staff]
      summary: List mods for staff review
      operationId: listStaffMods
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Mod records with owner and withheld fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMod'
  /staff/site:
    get:
      tags: [Staff]
      summary: Get staff site settings
      operationId: getStaffSiteSettings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Site settings and blocked words.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSiteSettings'
  /staff/log:
    get:
      tags: [Staff]
      summary: List staff actions
      operationId: listStaffActions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Staff action records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAction'
  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team
      operationId: getTeam
      responses:
        '200':
          description: Team details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
  /teams/{teamId}/icon:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team's icon
      operationId: getTeamIcon
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /teams/{teamId}/logo:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team's logo
      operationId: getTeamLogo
      responses:
        '200':
          content:
            image/png:
              schema: { type: string, format: binary }
  /teams/{teamId}/banner:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team's banner
      operationId: getTeamBanner
      responses:
        '200':
          content:
            image/png:
              schema: { type: string, format: binary }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fb_session
  parameters:
    ModId:
      name: modId
      in: path
      required: true
      description: Mod identifier shown in the site's mod URLs.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    LoginUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
        avatar: { type: integer }
        theme: { type: string }
        background: { type: integer }
        discord: { type: boolean }
        blocked: { type: array, items: { type: integer } }
    Settings:
      type: object
      properties:
        username: { type: string }
        email: { type: string, format: email }
        hasPassword: { type: boolean }
        friendRequests: { type: string }
        theme: { type: string }
        background: { type: integer }
        discord: { type: object, additionalProperties: true }
    StaffOverview:
      type: object
      properties:
        openReports: { type: integer }
        penalized: { type: integer }
        staff:
          type: array
          items: { $ref: '#/components/schemas/UserCard' }
        users: { type: integer }
        reasons: { type: array, items: {} }
    StaffReport:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        kind: { type: string }
        target: { type: integer }
        label: { type: string }
        owner: { type: [object, 'null'], additionalProperties: true }
        snapshot: { type: string }
        reason: { type: string }
        details: { type: string }
        by: { type: [object, 'null'], additionalProperties: true }
        trusted: { type: boolean }
        at: { type: string, format: date-time }
        status: { type: string }
        handledBy: { type: [object, 'null'], additionalProperties: true }
        handledAt: { type: [string, 'null'] }
        note: { type: string }
    PenalizedUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        avatar: { type: integer }
        role: { type: string }
        ban: { type: [object, 'null'], additionalProperties: true }
        mute: { type: [object, 'null'], additionalProperties: true }
    StaffMod:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        owner: { type: [object, 'null'], additionalProperties: true }
        withheld: { type: [object, 'null'], additionalProperties: true }
    StaffSiteSettings:
      allOf:
        - $ref: '#/components/schemas/SiteInfo'
        - type: object
          properties:
            blockedWords: { type: string }
    StaffAction:
      type: object
      properties:
        id: { type: integer }
        by: { type: [object, 'null'], additionalProperties: true }
        action: { type: string }
        target: { type: [object, 'null'], additionalProperties: true }
        reason: { type: string }
        at: { type: string, format: date-time }
    SiteInfo:
      type: object
      properties:
        announcement: { type: string }
        uploadsOpen: { type: boolean }
        signupsOpen: { type: boolean }
        chatOpen: { type: boolean }
        slowMode: { type: integer }
        todaysPick: { type: [string, 'null'] }
        chatRules: { type: array, items: { type: string } }
        modRules: { type: array, items: { type: string } }
        about: { type: object, additionalProperties: true }
        supporters: { type: array, items: { type: string } }
        inviteOnly: { type: boolean }
    SessionUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
        ban: { type: [object, 'null'], additionalProperties: true }
        mute: { type: [object, 'null'], additionalProperties: true }
        restricted: { type: [object, 'null'], additionalProperties: true }
        avatar: { type: integer }
        theme: { type: string }
        background: { type: integer }
        discord: { type: boolean }
        blocked: { type: array, items: { type: integer } }
    ModSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        tagline: { type: string }
        engine: { type: string }
        category: { type: string }
        thumbnail: { type: string }
        card: { type: string }
        team: { oneOf: [{ $ref: '#/components/schemas/TeamSummary' }, { type: 'null' }] }
        submitter: { $ref: '#/components/schemas/UserSummary' }
        approved: { type: boolean }
        featured: { type: boolean }
        withheld: { type: [string, 'null'] }
        downloads: { type: integer }
        views: { type: integer }
        likes: { type: integer }
        stars: { type: number }
        ratings: { type: integer }
        uploaded: { type: string, format: date-time }
        updated: { type: string }
        credits: { type: array, items: { type: object, additionalProperties: true } }
        wip: { oneOf: [{ $ref: '#/components/schemas/Wip' }, { type: 'null' }] }
    Mod:
      allOf:
        - $ref: '#/components/schemas/ModSummary'
        - type: object
          properties:
            description: { type: string }
            icon: { type: string }
            screenshots: { type: array, items: { type: string } }
            videos: { type: array, items: { type: string, format: uri } }
            files: { type: array, items: { type: object, additionalProperties: true } }
            miscFiles: { type: array, items: { type: object, additionalProperties: true } }
            socials: { type: array, items: { type: object, additionalProperties: true } }
            creator: { type: string }
            originalMod: { type: string }
            updates: { type: array, items: { type: object, additionalProperties: true } }
    Wip:
      type: object
      properties:
        stage: { type: string }
        progress: { type: number }
    UserSummary:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        avatar: { type: integer }
    UserCard:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatar: { type: integer }
        role: { type: string }
        online: { type: boolean }
    UserCardDetail:
      allOf:
        - $ref: '#/components/schemas/UserCard'
        - type: object
          properties:
            counts: { type: object, additionalProperties: { type: integer } }
    ChatMessage:
      type: object
      properties:
        id: { type: integer }
        poster: { type: integer }
        contents: { type: string }
        timestamp: { type: string, format: date-time }
        tagged: { type: [object, 'null'], additionalProperties: true }
        replyTo: { type: [object, 'null'], additionalProperties: true }
    User:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            role: { type: string }
            joined: { type: string, format: date-time }
            displayName: { type: string }
            quote: { type: string }
            about: { type: string }
            birthday: { type: [object, 'null'], additionalProperties: true }
            socials: { type: object, additionalProperties: { type: string } }
            misc: { type: array, items: { type: object, additionalProperties: true } }
            favourites: { type: array, items: { type: string } }
            banner: { type: integer }
            counts: { type: object, additionalProperties: { type: integer } }
