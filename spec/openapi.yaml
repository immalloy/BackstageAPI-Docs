openapi: 3.1.0
info:
  title: Funkin' Backstage API
  version: '2026-11-09'
  description: >-
    References from 2026-11-09. Some signed-in and staff responses still need checking.
    Routes and responses may change.
servers:
  - url: https://api.funkinbackstage.net
    description: Funkin' Backstage API
tags:
  - name: Site
    description: Public site configuration and information.
  - name: Mods
    description: Mod listings, details, media, comments, and votes.
  - name: Mod management
    description: Create, edit, publish, and upload mod content.
  - name: Users
    description: User profiles, search, and relationships.
  - name: Teams
    description: Team details and media.
  - name: Session
    description: Sign-in, account settings, and data for the current user.
  - name: Chat
    description: Recent chat messages.
  - name: Music
    description: Static tracks used by the sidebar player.
  - name: Staff
    description: Staff routes were captured in a signed-in session. Role requirements were not verified.
paths:
  /site:
    get:
      tags: [Site]
      summary: Get site configuration and public information
      operationId: getSite
      responses:
        '200':
          description: Public site configuration, including artwork indexes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInfo'
  /auth/me:
    get:
      tags: [Session]
      summary: Get the current session user
      description: Returns user null when the request has no valid session.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current session information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/SessionUser'
                      - type: 'null'
  /auth/login:
    post:
      tags: [Session]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Signed-in user. The response sets the `fb_session` cookie.
          headers:
            Set-Cookie:
              description: Session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/LoginUser'
  /auth/signup:
    post:
      tags: [Session]
      summary: Create an account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, writeOnly: true }
                invite: { type: string }
      responses:
        '202':
          description: Account verification is pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: string }
                  ticket: { type: string }
  /auth/verify:
    post:
      tags: [Session]
      summary: Verify an account
      operationId: verifyAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code, ticket]
              properties:
                identifier: { type: string }
                code: { type: string }
                ticket: { type: string, writeOnly: true }
      responses:
        '200':
          description: Verified user. The response sets the `fb_session` cookie.
          headers:
            Set-Cookie:
              description: Session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/LoginUser' }
  /auth/resend:
    post:
      tags: [Session]
      summary: Resend account verification
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, ticket]
              properties:
                identifier: { type: string }
                ticket: { type: string, writeOnly: true }
      responses:
        '202':
          description: Verification message requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: string }
  /auth/forgot:
    post:
      tags: [Session]
      summary: Start password recovery
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        '200':
          description: Password recovery ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
  /auth/reset:
    post:
      tags: [Session]
      summary: Reset a password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code, ticket, password]
              properties:
                identifier: { type: string }
                code: { type: string }
                ticket: { type: string, writeOnly: true }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Updated user. The response sets the `fb_session` cookie.
          headers:
            Set-Cookie:
              description: Session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/LoginUser' }
  /auth/logout:
    post:
      tags: [Session]
      summary: Sign out
      operationId: logout
      responses:
        '200':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
  /notifications:
    get:
      tags: [Session]
      summary: Get notifications for the current session
      description: Only a signed-in request was captured.
      operationId: getNotifications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notification items and unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  unread:
                    type: integer
        '401':
          $ref: '#/components/responses/SessionRequired'
  /notifications/read:
    post:
      tags: [Session]
      summary: Mark notifications as read
      operationId: markNotificationsRead
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Updated notification list and unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  unread:
                    type: integer
  /chat/read:
    get:
      tags: [Chat]
      summary: Get recent chat messages
      description: An anonymous request returned recent chat messages on 2026-11-09.
      operationId: getChatMessages
      responses:
        '200':
          description: Chat messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
  /settings:
    get:
      tags: [Session]
      summary: Get account settings
      operationId: getSettings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Account settings. No captured values are included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/SessionRequired'
    patch:
      tags: [Session]
      summary: Update account settings
      description: The capture shows a theme update; other writable fields are unknown.
      operationId: updateSettings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme: { type: string }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
  /settings/delete:
    post:
      tags: [Session]
      summary: Delete the current account
      operationId: deleteAccount
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Account deleted. The response clears the `fb_session` cookie.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401':
          description: The session or password was not accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /mods:
    get:
      tags: [Mods]
      summary: List mods
      operationId: listMods
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string }
        - name: engine
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: ids
          in: query
          required: false
          description: Comma-separated mod identifiers.
          schema: { type: string }
        - name: related
          in: query
          required: false
          schema: { type: string }
        - name: pick
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated mod search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModListResponse'
    post:
      tags: [Mod management]
      summary: Create a mod draft
      operationId: createMod
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModInput'
      responses:
        '201':
          description: Created mod identifier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
  /mods/{modId}:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod
      operationId: getMod
      responses:
        '200':
          description: Mod details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
    patch:
      tags: [Mod management]
      summary: Update a mod
      operationId: updateMod
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModUpdate'
      responses:
        '200':
          description: Updated mod details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
  /mods/{modId}/edit:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mod management]
      summary: Get mod editing data
      operationId: getModEditData
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Editable fields and existing media and file metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModEdit'
        '401':
          $ref: '#/components/responses/SessionRequired'
  /mods/{modId}/card:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod card image
      operationId: getModCard
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
    put:
      tags: [Mod management]
      summary: Upload a mod card image
      operationId: uploadModCard
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Upload result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /mods/{modId}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod thumbnail
      operationId: getModThumbnail
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
    put:
      tags: [Mod management]
      summary: Upload a mod thumbnail
      operationId: uploadModThumbnail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Upload result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /mods/{modId}/icon:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get a mod icon
      operationId: getModIcon
      responses:
        '200':
          content:
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
    put:
      tags: [Mod management]
      summary: Upload a mod icon
      operationId: uploadModIcon
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Upload result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /mods/{modId}/screenshots/{index}:
    parameters:
      - $ref: '#/components/parameters/ModId'
      - name: index
        in: path
        required: true
        description: Zero-based screenshot index.
        schema: { type: integer, minimum: 0 }
    get:
      tags: [Mods]
      summary: Get a mod screenshot
      operationId: getModScreenshot
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
    put:
      tags: [Mod management]
      summary: Upload a mod screenshot
      operationId: uploadModScreenshot
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Upload result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /mods/{modId}/file-link:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Mod management]
      summary: Start a mod file upload
      operationId: startModFileUpload
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name: { type: string }
                size: { type: integer }
      responses:
        '200':
          description: Upload URL data and the accepted part size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModFileUpload'
  /mods/{modId}/file-part/{partNumber}:
    parameters:
      - $ref: '#/components/parameters/ModId'
      - name: partNumber
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Mod management]
      summary: Upload a mod file part
      description: The HAR has no request-body details, so this uses a raw binary part.
      operationId: uploadModFilePart
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded part number and entity tag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partNumber: { type: integer }
                  etag: { type: string }
  /mods/{modId}/file-done:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Mod management]
      summary: Finish a mod file upload
      operationId: completeModFileUpload
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    $ref: '#/components/schemas/UploadedFilePart'
      responses:
        '200':
          description: Upload completion status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /mods/{modId}/publish:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Mod management]
      summary: Publish a mod
      operationId: publishMod
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Published mod details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
  /mods/{modId}/comments:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: List comments on a mod
      operationId: listModComments
      responses:
        '200':
          description: Comments returned for the mod.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      tags: [Mods]
      summary: Add a comment to a mod
      operationId: createModComment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contents]
              properties:
                contents: { type: string }
      responses:
        '201':
          description: Created comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /mods/{modId}/votes:
    parameters:
      - $ref: '#/components/parameters/ModId'
    get:
      tags: [Mods]
      summary: Get mod vote totals and current-user vote state
      operationId: getModVotes
      responses:
        '200':
          description: Vote totals and session-specific vote state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
  /mods/{modId}/like:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Mods]
      summary: Set whether the current user likes a mod
      operationId: setModLike
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        '200':
          description: Updated vote totals and current-user state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
  /mods/{modId}/rating:
    parameters:
      - $ref: '#/components/parameters/ModId'
    put:
      tags: [Mods]
      summary: Set the current user's star rating for a mod
      operationId: setModRating
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer }
      responses:
        '200':
          description: Updated vote totals and current-user state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user profile
      operationId: getUser
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users:
    get:
      tags: [Users]
      summary: Search users
      operationId: searchUsers
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Matching user records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchResult'
  /users/{userId}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user's avatar
      operationId: getUserAvatar
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /users/{userId}/banner:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user's profile banner
      operationId: getUserBanner
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /users/{userId}/posts:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's posts
      operationId: listUserPosts
      responses:
        '200':
          description: Posts authored by the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
  /users/{userId}/teams:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's teams
      operationId: listUserTeams
      responses:
        '200':
          description: Teams the user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamSummary'
  /users/{userId}/card:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user's profile card
      operationId: getUserCard
      responses:
        '200':
          description: Compact user profile and counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCardDetail'
  /users/{userId}/followers:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's followers
      operationId: listUserFollowers
      responses:
        '200':
          description: User cards for followers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/{userId}/following:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List users followed by a user
      operationId: listUserFollowing
      responses:
        '200':
          description: User cards for followed accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/{userId}/friends:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List a user's friends
      operationId: listUserFriends
      responses:
        '200':
          description: User cards for friends.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCard'
  /users/{userId}/follow:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Follow or unfollow a user
      operationId: setUserFollow
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
